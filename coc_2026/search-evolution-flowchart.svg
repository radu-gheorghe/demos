<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1320" width="760" height="1320" role="img" aria-labelledby="title desc">
  <title id="title">How search evolves</title>
  <desc id="desc">Top-to-bottom flow of search interfaces: ranked results, a summarized answer, a conversation, and an action that finds a part, checks price and stock, and confirms delivery.</desc>
  <defs>
    <filter id="card" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1C1917" flood-opacity="0.07"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1 L8.5 5 L1 9 Z" fill="#9A938C"/>
    </marker>
  </defs>

  <rect width="760" height="1320" fill="#F6F4F1"/>

  <!-- RESULTS -->
  <text x="78" y="36" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8A8178" letter-spacing="1.8">RESULTS</text>
  <g filter="url(#card)">
    <rect x="78" y="48" width="604" height="248" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="100" y="66" width="560" height="36" rx="18" fill="#F3F1EE"/>
  <circle cx="122" cy="84" r="6.5" fill="none" stroke="#A39E96" stroke-width="1.7"/>
  <line x1="127" y1="89" x2="132" y2="94" stroke="#A39E96" stroke-width="1.7" stroke-linecap="round"/>
  <text x="144" y="89" font-family="Inter, sans-serif" font-size="13" fill="#6B6560">brake pads for a 2018 Civic</text>

  <text x="100" y="128" font-family="Inter, sans-serif" font-size="11" fill="#1E8E6A">autozone.com</text>
  <text x="100" y="148" font-family="Inter, sans-serif" font-size="15" fill="#1A56C4">Ceramic brake pads — Honda Civic</text>
  <text x="100" y="168" font-family="Inter, sans-serif" font-size="12" fill="#8A8178">Fits 2016–2021. Free store pickup.</text>

  <text x="100" y="202" font-family="Inter, sans-serif" font-size="11" fill="#1E8E6A">rockauto.com</text>
  <text x="100" y="222" font-family="Inter, sans-serif" font-size="15" fill="#1A56C4">Front pad set, Civic EX</text>
  <text x="100" y="242" font-family="Inter, sans-serif" font-size="12" fill="#8A8178">$38.40 · in stock at 3 sellers</text>

  <line x1="380" y1="308" x2="380" y2="346" stroke="#9A938C" stroke-width="2" marker-end="url(#head)"/>

  <!-- ANSWERS -->
  <text x="78" y="374" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8A8178" letter-spacing="1.8">ANSWERS</text>
  <g filter="url(#card)">
    <rect x="78" y="386" width="604" height="236" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="100" y="402" width="560" height="32" rx="16" fill="#F3F1EE"/>
  <circle cx="120" cy="418" r="6" fill="none" stroke="#A39E96" stroke-width="1.6"/>
  <line x1="124.5" y1="422.5" x2="129" y2="427" stroke="#A39E96" stroke-width="1.6" stroke-linecap="round"/>
  <text x="140" y="423" font-family="Inter, sans-serif" font-size="12" fill="#6B6560">brake pads for a 2018 Civic</text>

  <rect x="100" y="448" width="560" height="112" rx="14" fill="#F3FAF8"/>
  <rect x="100" y="448" width="5" height="112" fill="#1F8A80"/>
  <text x="122" y="476" font-family="Inter, sans-serif" font-size="14" fill="#1C2430">Ceramic pads fit a 2018 Civic.</text>
  <text x="122" y="498" font-family="Inter, sans-serif" font-size="14" fill="#1C2430">Most run $36–$48, in stock nearby.</text>
  <circle cx="132" cy="532" r="7" fill="#D9A15A"/>
  <text x="146" y="536" font-family="Inter, sans-serif" font-size="11" fill="#6B6560">AutoZone</text>
  <circle cx="214" cy="532" r="7" fill="#6A8FBF"/>
  <text x="228" y="536" font-family="Inter, sans-serif" font-size="11" fill="#6B6560">RockAuto</text>

  <text x="100" y="590" font-family="Inter, sans-serif" font-size="13" fill="#B7C3D6">Ceramic brake pads — Honda Civic</text>
  <text x="100" y="606" font-family="Inter, sans-serif" font-size="11" fill="#D0CBC4">autozone.com</text>

  <line x1="380" y1="634" x2="380" y2="672" stroke="#9A938C" stroke-width="2" marker-end="url(#head)"/>

  <!-- CONVERSATION -->
  <text x="78" y="700" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8A8178" letter-spacing="1.8">CONVERSATION</text>
  <g filter="url(#card)">
    <rect x="78" y="712" width="604" height="228" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="96" y="728" width="568" height="156" rx="14" fill="#F7F6F4"/>

  <rect x="348" y="744" width="292" height="34" rx="17" fill="#E6E1F7"/>
  <text x="364" y="766" font-family="Inter, sans-serif" font-size="13" fill="#3D3A46">Which pads fit a 2018 Civic?</text>

  <circle cx="124" cy="816" r="12" fill="#6A5ACD"/>
  <rect x="144" y="794" width="318" height="46" rx="14" fill="#FFFFFF"/>
  <text x="158" y="814" font-family="Inter, sans-serif" font-size="13" fill="#3D3A46">Ceramic fronts, about $40,</text>
  <text x="158" y="830" font-family="Inter, sans-serif" font-size="13" fill="#3D3A46">in stock nearby.</text>

  <rect x="430" y="848" width="210" height="30" rx="15" fill="#E6E1F7"/>
  <text x="446" y="868" font-family="Inter, sans-serif" font-size="13" fill="#3D3A46">Can you get the cheapest?</text>

  <rect x="100" y="896" width="560" height="28" rx="14" fill="#F3F1EE"/>
  <text x="116" y="914" font-family="Inter, sans-serif" font-size="12" fill="#B7B1A8">Reply…</text>
  <circle cx="638" cy="910" r="10" fill="#6A5ACD"/>
  <path d="M634 910 h8 M638 906 v8" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>

  <line x1="380" y1="952" x2="380" y2="990" stroke="#9A938C" stroke-width="2" marker-end="url(#head)"/>

  <!-- ACTION -->
  <text x="78" y="1018" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8A8178" letter-spacing="1.8">ACTION</text>
  <g filter="url(#card)">
    <rect x="78" y="1030" width="604" height="220" rx="20" fill="#FFFFFF"/>
  </g>

  <rect x="100" y="1050" width="148" height="180" rx="14" fill="#F4EFE8"/>
  <circle cx="174" cy="1128" r="36" fill="none" stroke="#8C8378" stroke-width="7"/>
  <circle cx="174" cy="1128" r="13" fill="none" stroke="#8C8378" stroke-width="5"/>
  <rect x="167" y="1090" width="14" height="9" rx="2" fill="#8C8378"/>
  <text x="174" y="1196" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8A8178">Front pads</text>

  <text x="272" y="1078" font-family="Inter, sans-serif" font-size="16" fill="#1C2430">Ceramic front pads</text>
  <text x="272" y="1112" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#1C2430">$36.40</text>
  <text x="348" y="1112" font-family="Inter, sans-serif" font-size="13" fill="#8A8178">best price</text>

  <circle cx="280" cy="1140" r="7" fill="#1F8A80"/>
  <path d="M276.8 1140.2 l2.2 2.2 4.2-4.6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="296" y="1144" font-family="Inter, sans-serif" font-size="13" fill="#1F8A80">In stock</text>

  <rect x="272" y="1164" width="372" height="48" rx="12" fill="#F8F1EE"/>
  <circle cx="298" cy="1188" r="11" fill="#D4654A"/>
  <path d="M298 1181.5 c-2.6 0-4.8 2-4.8 4.6 0 3.4 4.8 7.6 4.8 7.6 s4.8-4.2 4.8-7.6 c0-2.6-2.2-4.6-4.8-4.6z" fill="#FFFFFF"/>
  <circle cx="298" cy="1186" r="1.6" fill="#D4654A"/>
  <text x="318" y="1184" font-family="Inter, sans-serif" font-size="13" fill="#1C2430">Delivers here tomorrow</text>
  <text x="318" y="1202" font-family="Inter, sans-serif" font-size="11" fill="#A08A84">Confirmed for your address</text>
  <circle cx="616" cy="1188" r="11" fill="#1F8A80"/>
  <path d="M611 1188.2 l3.2 3.2 6-6.2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
