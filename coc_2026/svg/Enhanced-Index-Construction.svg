<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    
    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05" />
    </filter>

    <!-- Icon symbols -->
    <symbol id="agentIcon" viewBox="0 0 128 128">
      <g stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="64" cy="15" r="9"/>
        <path d="M64 24V44"/>
        <path d="M19 73C25 55 40 46 64 46S103 55 109 73H113C118 73 121 77 121 82V92C121 97 118 101 113 101H109C105 113 94 120 78 120H50C34 120 23 113 19 101H15C10 101 7 97 7 92V82C7 77 10 73 15 73H19Z"/>
        <path d="M34 92V84C34 67 46 62 64 62S94 67 94 84V92"/>
      </g>
      <circle cx="51" cy="87" r="6" fill="#2563EB"/>
      <circle cx="77" cy="87" r="6" fill="#2563EB"/>
    </symbol>
    <symbol id="featureIcon" viewBox="0 0 612 612">
      <g transform="translate(324 269) rotate(45)" fill="#FF7A00" stroke="#FF7A00" stroke-linejoin="round" stroke-linecap="round">
        <path d="M-38 -60 V-185 A38 38 0 0 1 38 -185 V-60 Z" stroke="none"/>
        <rect x="-72" y="-68" width="144" height="38" rx="19" stroke="none"/>
        <rect x="-28" y="-34" width="56" height="18" stroke="none"/>
        <path d="M-24 -20 V150 L-10 196 V208 A10 10 0 0 0 10 208 V196 L24 150 V-20" fill="none" stroke-width="9"/>
        <path d="M-12 70 L12 46 V148 L3 180 H-3 L-12 148 Z" stroke="none"/>
      </g>
    </symbol>

  </defs>

  <style>
    /* Base animation class */
    .fade {
      opacity: 0;
      animation: dropIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    /* Keyframes for a slight drop-down fade effect */
    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Staggered delays to sequence evenly over exactly 4 seconds */
    .delay-title { animation-delay: 0s; }
    .delay-step1 { animation-delay: 0.4s; }
    .delay-arr1  { animation-delay: 0.7s; }
    .delay-step2 { animation-delay: 1.0s; }
    .delay-arr2  { animation-delay: 1.3s; }
    .delay-step3 { animation-delay: 1.6s; }
    .delay-arr3  { animation-delay: 1.9s; }
    .delay-step4 { animation-delay: 2.2s; }
    .delay-arr4  { animation-delay: 2.5s; }
    .delay-step5 { animation-delay: 2.8s; }
    .delay-arr5  { animation-delay: 3.1s; }
    .delay-final { animation-delay: 3.4s; }
    .delay-icons1 { animation-delay: 4.2s; }
    .delay-icons2 { animation-delay: 4.6s; }
    .delay-icons3 { animation-delay: 5.0s; }
    .delay-icons4 { animation-delay: 5.4s; }
    .delay-icons5 { animation-delay: 5.8s; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <g class="fade delay-title">
    <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20" fill="#0f172a">
      Enhanced Index Construction: Corpus Native Pipeline
    </text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g class="fade delay-step1">
    <g filter="url(#shadow)">
      <rect x="150" y="60" width="500" height="110" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="2" />
    </g>
    <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e293b">Step 1: Contextual Parser</text>
    <text x="400" y="112" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#475569">Extract document structure and hierarchy features</text>
    <text x="400" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">↳ Multi-document files, sections, TOC, headings hierarchy, paragraphs,</text>
    <text x="400" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">lists, tables, page-split content, footers, signatures, etc.</text>
  </g>

  <g class="fade delay-arr1">
    <line x1="400" y1="170" x2="400" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g class="fade delay-step2">
    <g filter="url(#shadow)">
      <rect x="150" y="210" width="500" height="90" rx="8" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2" />
    </g>
    <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e293b">Step 2: Exploratory Data Analysis Index</text>
    <text x="400" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Generate metadata &amp; tokens for initial discovery</text>
    <text x="400" y="282" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0284c7">↳ Phraseology Construction • Symbol Usage</text>
  </g>

  <g class="fade delay-arr2">
    <line x1="400" y1="300" x2="400" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g class="fade delay-step3">
    <g filter="url(#shadow)">
      <rect x="150" y="340" width="500" height="90" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" />
    </g>
    <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e293b">Step 3: Skip-gram Model w/ Negative Sampling</text>
    <text x="400" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Map deep contextual word relationships within the text</text>
    <text x="400" y="412" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#7c3aed">↳ Corpus Native Semantics</text>
  </g>

  <g class="fade delay-arr3">
    <line x1="400" y1="430" x2="400" y2="470" stroke="#64748b" stroke-width="2" marker-end="url" />
  </g>

  <!-- ==================== STEP 4 ==================== -->
  <g class="fade delay-step4">
    <g filter="url(#shadow)">
      <rect x="150" y="470" width="500" height="90" rx="8" fill="#f8fafc" stroke="#f43f5e" stroke-width="2" />
    </g>
    <text x="400" y="500" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e293b">Step 4: Corpus Native Entity Model</text>
    <text x="400" y="522" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Identify and link domain-specific knowledge nodes</text>
    <text x="400" y="542" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#e11d48">↳ Corpus Native Entities of Significance</text>
  </g>

  <g class="fade delay-arr4">
    <line x1="400" y1="560" x2="400" y2="600" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== STEP 5 ==================== -->
  <g class="fade delay-step5">
    <g filter="url(#shadow)">
      <rect x="150" y="600" width="500" height="90" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="2" />
    </g>
    <text x="400" y="630" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#1e293b">Step 5: Feature Enriched Index</text>
    <text x="400" y="652" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Combine tokens, semantics, and entities into searchable structures</text>
    <text x="400" y="672" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#d97706">↳ Multi-modal Retrieval Ready</text>
  </g>

  <!-- Branching Arrows for Step 5 Outputs -->
  <g class="fade delay-arr5">
    <path d="M 400 690 L 400 720 L 250 720 L 250 740" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 400 690 L 400 720 L 550 720 L 550 740" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- Output A: Inverted Index -->
  <g class="fade delay-final">
    <g filter="url(#shadow)">
      <rect x="150" y="750" width="200" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2" />
    </g>
    <text x="250" y="776" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1e293b">Inverted Index</text>
    <text x="250" y="796" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Keyword &amp; Entity maps</text>
  </g>

  <!-- Output B: Vector Index -->
  <g class="fade delay-final">
    <g filter="url(#shadow)">
      <rect x="450" y="750" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" />
    </g>
    <text x="550" y="776" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1e293b">Vector Index</text>
    <text x="550" y="796" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Rich Semantic Embeddings</text>
  </g>


  <!-- Delayed step annotations: appear card-by-card after all cards are visible -->
  <g class="fade delay-icons1" aria-label="Step 1 annotations">
    <g role="img" aria-label="feature icon annotation for Step 1">
      <circle cx="640" cy="74" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#featureIcon" x="631" y="65" width="18" height="18"/>
    </g>
  </g>

  <g class="fade delay-icons2" aria-label="Step 2 annotations">
    <g role="img" aria-label="feature icon annotation for Step 2">
      <circle cx="608" cy="224" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#featureIcon" x="599" y="215" width="18" height="18"/>
    </g>
    <g role="img" aria-label="agent icon annotation for Step 2">
      <circle cx="640" cy="224" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#agentIcon" x="630" y="214" width="20" height="20"/>
    </g>
  </g>

  <g class="fade delay-icons3" aria-label="Step 3 annotations">
    <g role="img" aria-label="feature icon annotation for Step 3">
      <circle cx="608" cy="354" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#featureIcon" x="599" y="345" width="18" height="18"/>
    </g>
    <g role="img" aria-label="agent icon annotation for Step 3">
      <circle cx="640" cy="354" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#agentIcon" x="630" y="344" width="20" height="20"/>
    </g>
  </g>

  <g class="fade delay-icons4" aria-label="Step 4 annotations">
    <g role="img" aria-label="feature icon annotation for Step 4">
      <circle cx="640" cy="484" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#featureIcon" x="631" y="475" width="18" height="18"/>
    </g>
  </g>

  <g class="fade delay-icons5" aria-label="Step 5 annotations">
    <g role="img" aria-label="feature icon annotation for Step 5">
      <circle cx="608" cy="614" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#featureIcon" x="599" y="605" width="18" height="18"/>
    </g>
    <g role="img" aria-label="agent icon annotation for Step 5">
      <circle cx="640" cy="614" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <use href="#agentIcon" x="630" y="604" width="20" height="20"/>
    </g>
  </g>

</svg>
