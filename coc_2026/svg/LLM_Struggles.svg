<text x="114" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">2</text>
<text x="114" y="424" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#15253F" text-anchor="start" >Arithmetic on Arbitrary Numbers</text>
</g>
