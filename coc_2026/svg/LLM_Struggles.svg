<rect x="84" y="612" width="5" height="64" rx="2.5" fill="#367AF0"/>
<text x="114" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">4</text>
<text x="114" y="668" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#15253F" text-anchor="start" >Spelling Puzzles</text>
</g>
<g class="reveal" style="animation-delay:1.74s">
<rect x="84" y="716" width="1430" height="100" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="734" width="5" height="64" rx="2.5" fill="#367AF0"/>
<text x="114" y="754" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">5</text>
<text x="114" y="790" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#15253F" text-anchor="start" >Modified Classic Riddles</text>
</g>
<g class="reveal" style="animation-delay:2.02s">
<rect x="84" y="838" width="1430" height="100" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="856" width="5" height="64" rx="2.5" fill="#367AF0"/>
<text x="114" y="876" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">6</text>
<text x="114" y="912" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#15253F" text-anchor="start" >Extracting Exact Text</text>
</g>
<g class="reveal" style="animation-delay:2.30s">
<rect x="84" y="960" width="1430" height="122" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="978" width="5" height="86" rx="2.5" fill="#367AF0"/>
<text x="114" y="998" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">7</text>
<text x="114" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#15253F" text-anchor="start" >Annotating Text</text>
<circle cx="118" cy="1059" r="4.3" fill="#367AF0"/>
<text x="138" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="450" fill="#53657F" text-anchor="start" >15 minutes for 25 paragraphs</text>
</g>
<g class="reveal" style="animation-delay:2.90s">
<line x1="84" y1="1225" x2="1514" y2="1225" stroke="#DCE6F1" stroke-width="1"/>
<text x="1514" y="1246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#8191A8" text-anchor="end" letter-spacing="1.4">LLM STRUGGLES</text>
</g>
</svg>