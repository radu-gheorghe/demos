<rect x="84" y="490" width="5" height="64" rx="2.5" fill="#367AF0"/>
<text x="114" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="750" fill="#367AF0" text-anchor="start" letter-spacing="1.5">3</text>
<text x="114" y="546" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#15253F" text-anchor="start" >Bidirectional Generalization</text>
</g>
