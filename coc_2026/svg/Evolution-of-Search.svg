<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 940" role="img" aria-label="Presentation outline overview for Search, Action and Tools">
<title>Presentation Outline — Topic Overview</title>
<desc>Animated overview introducing the three topics: Search, Action and Tools in a vertical sequence.</desc>
<defs>
  <filter id="cardShadow" x="-6%" y="-12%" width="112%" height="130%">
     <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#213E60" flood-opacity="0.065"/>
  </filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFE"/>
    <stop offset="100%" stop-color="#F1F6FD"/>
  </linearGradient>
</defs>
<style><![CDATA[
  .reveal { opacity:0; animation: reveal 0.78s cubic-bezier(.19,1,.22,1) forwards; }
  @keyframes reveal {
    from { opacity:0; transform:translateY(-14px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity:1; animation:none; }
  }
]]></style>
<rect x="0" y="0" width="1600" height="940" fill="url(#bg)"/>
<circle cx="1505" cy="8" r="210" fill="#EAF1FC" opacity="0.66"/>
<circle cx="1555" cy="15" r="130" fill="#F4F7FC" opacity="0.8"/>

<g class="reveal" style="animation-delay:0.0s">
<rect x="84" y="46" width="12" height="48" rx="6" fill="#367AF0"/>
<text x="120" y="82" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="750" fill="#15253F" text-anchor="start" >Evolution of Search</text>
<text x="121" y="115" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="650" fill="#53657F" text-anchor="start" letter-spacing="2.3">3 Topics</text>
<line x1="84" y1="141" x2="1514" y2="141" stroke="#DAE4F0" stroke-width="1.2"/>
</g>

<g class="reveal" style="animation-delay:0.35s">
<rect x="84" y="170" width="42" height="42" rx="14" fill="#367AF0"/>
<text x="105" y="198" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle" >1</text>
<text x="145" y="199" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#15253F" text-anchor="start" >SEARCH</text>
<line x1="273" y1="189" x2="1514" y2="189" stroke="#D6E0EE" stroke-width="1.2"/>
</g>

<g class="reveal" style="animation-delay:0.75s">
<rect x="84" y="228" width="1430" height="128" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="246" width="5" height="92" rx="2.5" fill="#367AF0"/>
<circle cx="118" cy="273" r="4.3" fill="#367AF0"/>
<text x="138" y="280" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#53657F" text-anchor="start" ><tspan font-weight="700" fill="#367AF0">What is it?</tspan> Wayfinding? A Learning Process? Ambient Findability?</text>
<circle cx="118" cy="309" r="4.3" fill="#367AF0"/>
<text x="138" y="316" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#53657F" text-anchor="start" ><tspan font-weight="700" fill="#367AF0">What is its future?</tspan> User Experience? Tools? Scope? Complexity?</text>
</g>

<g class="reveal" style="animation-delay:1.25s">
<rect x="84" y="388" width="42" height="42" rx="14" fill="#0A9D9A"/>
<text x="105" y="416" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle" >2</text>
<text x="145" y="417" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#15253F" text-anchor="start" >ACTION</text>
<line x1="273" y1="407" x2="1514" y2="407" stroke="#D6E0EE" stroke-width="1.2"/>
</g>

<g class="reveal" style="animation-delay:1.65s">
<rect x="84" y="446" width="1430" height="128" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="464" width="5" height="92" rx="2.5" fill="#0A9D9A"/>
<circle cx="118" cy="507" r="4.3" fill="#0A9D9A"/>
<text x="138" y="514" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#53657F" text-anchor="start" ><tspan font-weight="700" fill="#0A9D9A">Actionable Information</tspan> What is it? What Forms can it take?</text>
</g>

<g class="reveal" style="animation-delay:2.15s">
<rect x="84" y="606" width="42" height="42" rx="14" fill="#8257D9"/>
<text x="105" y="634" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle" >3</text>
<text x="145" y="635" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#15253F" text-anchor="start" >TOOLS</text>
<line x1="257" y1="625" x2="1514" y2="625" stroke="#D6E0EE" stroke-width="1.2"/>
</g>

<g class="reveal" style="animation-delay:2.55s">
<rect x="84" y="664" width="1430" height="128" rx="18" fill="#FFFFFF" stroke="#DFE7F0" stroke-width="1.3" filter="url(#cardShadow)"/>
<rect x="84" y="682" width="5" height="92" rx="2.5" fill="#8257D9"/>
<circle cx="118" cy="709" r="4.3" fill="#8257D9"/>
<text x="138" y="716" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#53657F" text-anchor="start" ><tspan font-weight="700" fill="#8257D9">What are they?</tspan> Facilitate a task? Shaping? Scaling? Speed? Reliability? Consistency?</text>
<circle cx="118" cy="741" r="4.3" fill="#8257D9"/>
<text x="138" y="748" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#53657F" text-anchor="start" ><tspan font-weight="700" fill="#8257D9">For enabling Search?</tspan> Current tools? Better tools now within reach?</text>
</g>

<g class="reveal" style="animation-delay:3.0s">
<line x1="84" y1="905" x2="1514" y2="905" stroke="#DCE6F1" stroke-width="1"/>
<text x="1514" y="926" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="650" fill="#8191A8" text-anchor="end" letter-spacing="1.4">OVERVIEW → SEARCH → ACTION → TOOLS</text>
</g>
</svg>